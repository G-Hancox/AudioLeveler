    <rect x="31" y="34" width="9" height="70" rx="3"/>
    <rect x="44" y="84" width="9" height="20" rx="3"/>
    <rect x="57" y="50" width="9" height="54" rx="3"/>
  </g>
  <!-- arrow -->
  <path d="M71 63 l7 0 0 -5 9 8 -9 8 0 -5 -7 0z" fill="#ffd166"/>
  <!-- after: leveled songs -->
  <g fill="url(#lit)">
    <rect x="91" y="55" width="9" height="49" rx="3"/>
    <rect x="104" y="55" width="9" height="49" rx="3"/>
  </g>
  <!-- target line -->
  <line x1="14" y1="52" x2="117" y2="52" stroke="#ffd166" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
